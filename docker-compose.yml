services:
  postgres:
    image: postgres:16-alpine
    container_name: antique-postgres
    environment:
      POSTGRES_USER: antique
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: antique_hunter
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: antique-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
